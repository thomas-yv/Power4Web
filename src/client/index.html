<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}}</title>
        <style>
            body {
                font-family: sans-serif;
                text-align: center;
                background: #fafafa;
            }
            .content {
                width: fit-content;
                margin-inline: auto;
                display: flex;
                flex-direction: column;
            }
            .btns {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.3em;
            }
            table {
                margin: auto;
                border-spacing: 0.5em;
                background-color: #4859cd;
                padding: 0.3em;
                border-radius: 2em;
                border: 0.5em solid #4353c6;
            }
            td {
                width: 60px;
                height: 60px;
                padding: 0.4em;
                border-radius: 50%;
                border: 0.5em solid #4353c6;
                background-color: white;
            }
            .p1 {
                background: red;
            }
            .p2 {
                background: yellow;
            }
            button {
                margin: 5px;
                padding: 5px 10px;
            }
        </style>
    </head>
    <body>
        <h1>{{.Title}}</h1>

        {{if .Win.IsWin}}
        <h2>🎉 Joueur {{.Win.Winner}} a gagné !</h2>
        {{else if .Win.IsDraw}}
        <h2>🤝 Match nul !</h2>
        {{else}}
        <h2>Tour du joueur {{.PlayerToPlay}}</h2>
        {{end}}

        <div class="content">
            <div class="btns">
                {{range $i, $v := .IsLineFull}} {{if not $v}}
                <a href="/play?col={{$i}}"
                    ><button>↓ Col {{add $i 1}}</button></a
                >
                {{else}}
                <button disabled>✖</button>
                {{end}} {{end}}
            </div>

            <!-- Grille du jeu -->
            <table>
                {{range .Rows}}
                <tr>
                    {{range .}}
                    <td
                        class="{{if eq .Player 1}}p1{{else if eq .Player 2}}p2{{end}}"
                    ></td>
                    {{end}}
                </tr>
                {{end}}
            </table>
        </div>
    </body>
</html>
